$kind: http-example
request:
  url: "{{baseUrl}}/books/:id"
  method: GET
  pathVariables:
    - key: id
      value: "{{mockBookId}}"
      description: Book ID
  body:
    type: json
    content: ""
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "id": {{mockBookId}},
        "title": "{{mockBookTitle}}",
        "author": "{{mockBookAuthor}}",
        "genre": "{{mockBookGenre}}",
        "publishedYear": {{mockBookPublishedYear}},
        "status": "{{mockBookStatus}}"
      }
order: 4000
