$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/books/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: "1"
      description: Book ID
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "book": {
          "id": "1",
          "title": "The Great Gatsby",
          "author": "F. Scott Fitzgerald",
          "year": 1925
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "book": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "example": "1"
              },
              "title": {
                "type": "string",
                "example": "The Great Gatsby"
              },
              "author": {
                "type": "string",
                "example": "F. Scott Fitzgerald"
              },
              "year": {
                "type": "integer",
                "example": 1925
              }
            },
            "required": [
              "id",
              "title",
              "author"
            ]
          }
        }
      }
order: 1000
