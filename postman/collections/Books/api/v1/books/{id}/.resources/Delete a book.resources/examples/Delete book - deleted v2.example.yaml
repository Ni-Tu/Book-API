$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/books/:id"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: "1"
      description: Book ID
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "message": "Book deleted successfully",
        "id": "{{id}}",
        "deletedAt": "{{$isoTimestamp}}",
        "traceId": "{{$randomUUID}}"
      }
order: 6000
