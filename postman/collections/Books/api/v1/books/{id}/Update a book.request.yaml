$kind: http-request
url: "{{baseUrl}}/api/v1/books/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    description: Book ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "example": "1"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "title": "Dune",
      "author": "Frank Herbert",
      "year": 1965
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "example": "Dune"
        },
        "author": {
          "type": "string",
          "example": "Frank Herbert"
        },
        "year": {
          "type": "integer",
          "example": 1965
        }
      },
      "required": [
        "title",
        "author"
      ]
    }
examples: ./.resources/Update a book.resources/examples
order: 2000
