$kind: http-request
url: "{{baseUrl}}/api/v1/books"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "Dune",
      "author": "Frank Herbert",
      "year": 1965
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "example": "Dune"
        },
        "author": {
          "type": "string",
          "example": "Frank Herbert"
        },
        "year": {
          "type": "integer",
          "example": 1965
        }
      },
      "required": [
        "title",
        "author"
      ]
    }
examples: ./.resources/Create a book.resources/examples
order: 2000
