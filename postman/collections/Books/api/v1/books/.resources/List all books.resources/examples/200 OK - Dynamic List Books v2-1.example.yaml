$kind: http-example
name: 200 OK - Dynamic List Books v2
request:
  url: "{{baseUrl}}/api/v2/books"
  method: GET
  headers:
    Accept: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "{{$randomInt}}",
          "title": "{{$randomWord}}",
          "author": "{{$randomFullName}}",
          "genre": "{{$randomWord}}",
          "publishedYear": {{$randomInt}},
          "status": "available"
        },
        {
          "id": "{{$randomInt}}",
          "title": "{{$randomWord}}",
          "author": "{{$randomFullName}}",
          "genre": "{{$randomWord}}",
          "publishedYear": {{$randomInt}},
          "status": "checked_out"
        }
      ]
order: 4000
